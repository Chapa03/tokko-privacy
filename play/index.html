<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Tokkon en Google Play</title>
<meta name="description" content="Descarga Tokkon en Google Play: selector con los dedos, ruleta, dados, crono y partidas.">
<meta property="og:title" content="Tokkon en Google Play">
<meta property="og:description" content="Selector con los dedos, ruleta, dados, crono y partidas. Descárgala gratis.">
<meta property="og:image" content="https://chapa03.github.io/tokko-privacy/testers/icon.png">
<link rel="icon" href="../testers/icon.png">
<noscript><meta http-equiv="refresh" content="0; url=https://play.google.com/store/apps/details?id=com.chapa.tokko"></noscript>
<script>
// Enlace para Instagram (y cualquier red): en Android abre directamente la app de Google Play (intent://,
// que el navegador interno de Instagram pasa al sistema); si no puede, la ficha web de Play. En otros
// sistemas, la ficha web. La página se ve igualmente con su botón y su QR por si nada se abre solo.
(function () {
  var id = "com.chapa.tokko";
  var web = "https://play.google.com/store/apps/details?id=" + id;
  if (/android/i.test(navigator.userAgent)) {
    location.href = "intent://details?id=" + id + "#Intent;scheme=market;package=com.android.vending;S.browser_fallback_url=" + encodeURIComponent(web) + ";end";
    setTimeout(function () { location.replace(web); }, 1500);
  } else {
    location.replace(web);
  }
})();
</script>
<style>
@font-face { font-family: "Tokko"; src: url("../testers/tokko.ttf") format("truetype"); font-display: swap; }
:root { color-scheme: dark; --bg: #070913; --text: #e8ecff; --muted: #a9b0d4; --accent: #00f0ff; --border: #ffffff22; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(120% 70% at 50% 0%, #0d2a3a 0%, var(--bg) 60%); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 420px; padding: 32px 16px; text-align: center; }
img.icon { width: 112px; height: 112px; border-radius: 28px; box-shadow: 0 8px 32px #ff9a1f33; }
h1 { margin: 16px 0 4px; font-family: "Tokko", system-ui, sans-serif; font-weight: 400; color: var(--accent); font-size: 44px; }
p { color: var(--muted); margin: 0 0 22px; }
.btn { display: inline-block; text-decoration: none; font-weight: 700; padding: 14px 22px; border-radius: 14px; background: var(--accent); color: var(--bg); }
.qr { margin-top: 26px; }
.qr img { width: 176px; height: 176px; border-radius: 12px; border: 6px solid #fff; background: #fff; }
.qr span { display: block; margin-top: 8px; font-size: 14px; color: var(--muted); }
[lang="en"] { display: none; }
body.en [lang="es"] { display: none; }
body.en [lang="en"] { display: revert; }
</style></head>
<body>
<main>
  <img class="icon" src="../testers/icon.png" alt="" width="112" height="112">
  <h1>Tokkon</h1>
  <p lang="es">Abriendo Google Play…</p>
  <p lang="en">Opening Google Play…</p>
  <a class="btn" href="https://play.google.com/store/apps/details?id=com.chapa.tokko"><span lang="es">Descargar en Google Play</span><span lang="en">Get it on Google Play</span></a>
  <div class="qr"><img src="qr.svg" alt="QR"><span lang="es">O escanéalo con el móvil</span><span lang="en">Or scan it with your phone</span></div>
</main>
<script>if (!/^es|^ca|^eu|^gl|^oc/i.test(navigator.language || "")) document.body.classList.add("en");</script>
</body></html>
